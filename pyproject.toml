[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpred"
version = "0.1.0"
description = "Daily US equity direction model with rule-based risk management, a cost-aware backtester, and Alpaca paper trading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "lightgbm>=4.1",
  "matplotlib>=3.8",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
broker = ["alpaca-py>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
stockpred = "stockpred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
